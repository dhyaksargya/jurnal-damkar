<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUNGKU AKU SUKSES NANTI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      padding: 40px 20px 60px;
      color: #1a3a8f;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a3a8f;
      letter-spacing: 6px;
      margin-bottom: 10px;
      text-align: center;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      font-size: 11px;
      font-weight: 400;
      color: #6b80b8;
      letter-spacing: 4px;
      text-transform: lowercase;
      margin-bottom: 28px;
    }

    .tbl-wrap {
      overflow-x: auto;
      border-radius: 0;
      border: 2px solid #1a3a8f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      table-layout: fixed;
    }

    colgroup col.c-waktu   { width: 160px; }
    colgroup col.c-suhu    { width: 120px; }
    colgroup col.c-gas     { width: 140px; }
    colgroup col.c-catatan { width: auto; }
    colgroup col.c-act     { width: 72px; }

    thead tr { background: #fff; }
    thead th {
      color: #1a3a8f;
      font-weight: 600;
      font-size: 13px;
      padding: 14px 12px;
      text-align: left;
      letter-spacing: 2px;
      border-bottom: 2px solid #1a3a8f;
    }

    tbody tr:nth-child(even) { background: #ffffff; }
    tbody tr:nth-child(odd)  { background: #ffffff; }
    tbody tr:hover           { background: #eef1ff; transition: background 0.1s; }

    tbody td {
      padding: 8px 10px;
      vertical-align: middle;
      border-top: 1px solid rgba(26, 58, 143, 0.1);
    }

    tbody td input[type="text"],
    tbody td input[type="number"],
    tbody td input[type="time"] {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      border: 1px solid #a0b4e8;
      border-radius: 0;
      padding: 6px 9px;
      background: #fff;
      color: #1a3a8f;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    tbody td input:focus {
      border-color: #1a3a8f;
      box-shadow: 0 0 0 3px rgba(26, 58, 143, 0.12);
    }

    td.time-cell {
      font-size: 13px;
      font-weight: 500;
      color: #1a3a8f;
      white-space: nowrap;
    }

    .time-display {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .time-text {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
    }

    td.suhu-cell input { text-align: center; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8fa0cc;
      font-size: 16px;
      padding: 3px 5px;
      border-radius: 0;
      transition: color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { color: #1a3a8f; background: #d0daff; }
    .icon-btn.del:hover { color: #c0392b; background: #fde8e8; }

    .act-cell {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      color: #1a3a8f;
      border: 2px solid #1a3a8f;
      border-radius: 0;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .add-btn:hover { background: #1a3a8f; color: #fff; }
    .add-btn i { font-size: 16px; }

    .chart-btn {
      flex: 1;
      background: #fff;
      color: #1a3a8f;
      border: 2px solid #1a3a8f;
      border-radius: 0;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .chart-btn:hover { background: #1a3a8f; color: #fff; }

    .chart-section {
      display: none;
      margin-top: 28px;
      border: 2px solid #1a3a8f;
      border-radius: 0;
      padding: 20px;
      background: #fff;
    }
    .chart-section.visible { display: block; }

    .chart-title {
      font-size: 15px;
      font-weight: 600;
      color: #1a3a8f;
      margin-bottom: 16px;
    }

    .chart-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #4a5e9e;
      margin-bottom: 12px;
    }
    .chart-legend span {
      display: inline-block;
      width: 24px;
      height: 3px;
      background: #1a3a8f;
      border-radius: 0;
    }

    .chart-canvas-wrap {
      position: relative;
      width: 100%;
      height: 320px;
    }

    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: #6b80b8;
      font-family: 'Inter', sans-serif;
      letter-spacing: 2px;
      text-transform: lowercase;
    }
    .footer a {
      color: #1a3a8f;
      font-weight: 600;
      text-decoration: none;
      letter-spacing: 2px;
    }
    .footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TUNGKU AKU SUKSES NANTI</h1>
    <p class="subtitle">sebuah jurnal damkar (dalam membakar keramik)</p>

    <div class="tbl-wrap">
      <table id="tbl">
        <colgroup>
          <col class="c-waktu" />
          <col class="c-suhu" />
          <col class="c-gas" />
          <col class="c-catatan" />
          <col class="c-act" />
        </colgroup>
        <thead>
          <tr>
            <th>WAKTU</th>
            <th>SUHU (°C)</th>
            <th>ISI GAS</th>
            <th>CATATAN</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <div class="actions">
      <button class="add-btn" onclick="addRow()">
        <i class="ti ti-plus" aria-hidden="true"></i> Tambah Baris
      </button>
      <button class="chart-btn" onclick="toggleChart()">Buat Grafik</button>
    </div>

    <div class="chart-section" id="chartSection">
      <div class="chart-title" id="chartTitle">Grafik Kenaikan Suhu</div>
      <div class="chart-legend">
        <span></span> Suhu (°C)
      </div>
      <div class="chart-canvas-wrap">
        <canvas id="tempChart" role="img" aria-label="Line chart kenaikan suhu tungku berdasarkan waktu pencatatan.">
          Grafik menampilkan data suhu tungku dari tabel di atas.
        </canvas>
      </div>
    </div>

    <div class="footer">
      dibuat oleh <a href="https://instagram.com/dhyaksargya" target="_blank" rel="noopener noreferrer">@dhyaksargya</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    let rowCount = 0;
    let chartInstance = null;

    function nowTimeStr() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function addRow() {
      rowCount++;
      const tbody = document.getElementById('tbody');
      const tr = document.createElement('tr');
      tr.dataset.id = rowCount;
      const id = rowCount;
      const time = nowTimeStr();
      tr.innerHTML = `
        <td class="time-cell">
          <div class="time-display" id="time-display-${id}">
            <span class="time-text" id="time-text-${id}">${time}</span>
            <button class="icon-btn" onclick="editTime(${id})" aria-label="edit waktu" title="Edit waktu">
              <i class="ti ti-pencil" aria-hidden="true"></i>
            </button>
          </div>
          <input type="time" id="time-input-${id}" value="${time}" style="display:none;"
            onblur="saveTime(${id})" onkeydown="if(event.key==='Enter')saveTime(${id})" />
        </td>
        <td class="suhu-cell"><input type="number" placeholder="cth. 1100" min="0" max="9999" step="0.1" /></td>
        <td><input type="text" placeholder="cth. 1/4 tabung" /></td>
        <td><input type="text" placeholder="catatan opsional..." /></td>
        <td>
          <div class="act-cell">
            <button class="icon-btn del" onclick="delRow(this)" aria-label="hapus baris" title="Hapus baris">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);
    }

    function editTime(id) {
      const display = document.getElementById('time-display-' + id);
      const input = document.getElementById('time-input-' + id);
      display.style.display = 'none';
      input.style.display = 'block';
      input.focus();
    }

    function saveTime(id) {
      const display = document.getElementById('time-display-' + id);
      const input = document.getElementById('time-input-' + id);
      const textEl = document.getElementById('time-text-' + id);
      const val = input.value;
      if (val) textEl.textContent = val;
      input.style.display = 'none';
      display.style.display = 'flex';
    }

    function delRow(btn) {
      btn.closest('tr').remove();
    }

    function getChartData() {
      const rows = document.querySelectorAll('#tbody tr');
      const labels = [];
      const values = [];
      rows.forEach(r => {
        const suhu = parseFloat(r.querySelector('td:nth-child(2) input').value);
        if (!isNaN(suhu)) {
          const timeText = r.querySelector('.time-text');
          labels.push(timeText ? timeText.textContent.trim() : '');
          values.push(suhu);
        }
      });
      return { labels, values };
    }

    function toggleChart() {
      const sec = document.getElementById('chartSection');
      const titleEl = document.getElementById('chartTitle');
      const { labels, values } = getChartData();

      sec.classList.add('visible');

      if (values.length === 0) {
        titleEl.textContent = 'Grafik Kenaikan Suhu — belum ada data suhu yang diisi.';
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }

      titleEl.textContent = 'Grafik Kenaikan Suhu';
      const ctx = document.getElementById('tempChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Suhu (°C)',
            data: values,
            borderColor: '#1a3a8f',
            backgroundColor: 'rgba(26, 58, 143, 0.10)',
            pointBackgroundColor: '#1a3a8f',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 6,
            pointHoverRadius: 8,
            fill: true,
            tension: 0.35,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: {
              callbacks: {
                label: ctx => ' ' + ctx.parsed.y.toFixed(1) + ' °C'
              }
            }
          },
          scales: {
            x: {
              ticks: {
                font: { family: 'Inter', size: 11 },
                color: '#4a5e9e',
                maxRotation: 30,
                autoSkip: true,
                maxTicksLimit: 10
              },
              grid: { color: 'rgba(26, 58, 143, 0.07)' }
            },
            y: {
              ticks: {
                font: { family: 'Inter', size: 11 },
                color: '#4a5e9e',
                callback: v => v + ' °C'
              },
              grid: { color: 'rgba(26, 58, 143, 0.07)' }
            }
          }
        }
      });
    }

    addRow();
  </script>
</body>
</html>
