<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TUNGKU AKU SUKSES NANTI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      min-height: 100vh;
      padding: 40px 20px 60px;
      color: #1a3a8f;
    }

    .wrap { max-width: 860px; margin: 0 auto; }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a3a8f;
      letter-spacing: 6px;
      margin-bottom: 10px;
      text-align: center;
      text-transform: uppercase;
    }

    .subtitle {
      text-align: center;
      font-size: 11px;
      font-weight: 400;
      color: #6b80b8;
      letter-spacing: 4px;
      text-transform: lowercase;
      margin-bottom: 28px;
    }

    .save-indicator {
      text-align: center;
      font-size: 11px;
      letter-spacing: 2px;
      color: #8fa0cc;
      margin-bottom: 16px;
      min-height: 16px;
      transition: color 0.3s;
    }
    .save-indicator.saved { color: #3a8f5a; }

    /* ── DESKTOP TABLE ── */
    .tbl-wrap { overflow-x: auto; border: 2px solid #1a3a8f; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      table-layout: fixed;
    }

    colgroup col.c-waktu   { width: 140px; }
    colgroup col.c-suhu    { width: 110px; }
    colgroup col.c-gas     { width: 130px; }
    colgroup col.c-catatan { width: auto; }
    colgroup col.c-act     { width: 64px; }

    thead tr { background: #fff; }
    thead th {
      color: #1a3a8f;
      font-weight: 600;
      font-size: 12px;
      padding: 14px 12px;
      text-align: left;
      letter-spacing: 2px;
      border-bottom: 2px solid #1a3a8f;
    }

    tbody tr { background: #fff; }
    tbody tr:hover { background: #eef1ff; transition: background 0.1s; }

    tbody td {
      padding: 8px 10px;
      vertical-align: middle;
      border-top: 1px solid rgba(26, 58, 143, 0.1);
    }

    tbody td input[type="text"],
    tbody td input[type="number"],
    tbody td input[type="time"] {
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      border: 1px solid #a0b4e8;
      border-radius: 0;
      padding: 6px 9px;
      background: #fff;
      color: #1a3a8f;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    tbody td input:focus {
      border-color: #1a3a8f;
      box-shadow: 0 0 0 3px rgba(26, 58, 143, 0.12);
    }

    td.time-cell { font-size: 13px; font-weight: 500; color: #1a3a8f; white-space: nowrap; }
    .time-display { display: flex; align-items: center; gap: 4px; }
    .time-text { flex: 1; font-size: 13px; font-weight: 500; }
    td.suhu-cell input { text-align: center; }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8fa0cc;
      font-size: 16px;
      padding: 3px 5px;
      transition: color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn:hover { color: #1a3a8f; background: #d0daff; }
    .icon-btn.del:hover { color: #c0392b; background: #fde8e8; }
    .act-cell { display: flex; align-items: center; gap: 2px; }

    /* ── MOBILE CARDS ── */
    .card-list { display: none; }

    .entry-card {
      border: 2px solid #1a3a8f;
      background: #fff;
      margin-bottom: 12px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(26, 58, 143, 0.15);
      background: #f8f8f8;
    }

    .card-num { font-size: 11px; font-weight: 600; letter-spacing: 2px; color: #8fa0cc; }

    .card-body { display: flex; flex-direction: column; }

    .card-field {
      padding: 10px 14px;
      border-bottom: 1px solid rgba(26, 58, 143, 0.08);
    }
    .card-field:last-child { border-bottom: none; }
    .card-field.full { border-right: none; }

    .card-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2px;
      color: #8fa0cc;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .card-field input[type="text"],
    .card-field input[type="number"],
    .card-field input[type="time"] {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      border: 1px solid #a0b4e8;
      border-radius: 0;
      padding: 7px 10px;
      background: #fff;
      color: #1a3a8f;
      width: 100%;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .card-field input:focus { border-color: #1a3a8f; box-shadow: 0 0 0 3px rgba(26, 58, 143, 0.12); }

    .card-time-display { display: flex; align-items: center; gap: 6px; }
    .card-time-text { font-size: 14px; font-weight: 500; color: #1a3a8f; flex: 1; }

    /* ── BUTTONS ── */
    .actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .add-btn {
      display: flex;
      align-items: center;
      gap: 7px;
      background: #fff;
      color: #1a3a8f;
      border: 2px solid #1a3a8f;
      border-radius: 0;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .add-btn:hover { background: #1a3a8f; color: #fff; }
    .add-btn i { font-size: 16px; }

    .chart-btn {
      flex: 1;
      background: #fff;
      color: #1a3a8f;
      border: 2px solid #1a3a8f;
      border-radius: 0;
      padding: 10px 20px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
    }
    .chart-btn:hover { background: #1a3a8f; color: #fff; }

    .clear-btn {
      background: #fff;
      color: #c0392b;
      border: 2px solid #c0392b;
      border-radius: 0;
      padding: 10px 16px;
      font-family: 'Inter', sans-serif;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: background 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .clear-btn:hover { background: #c0392b; color: #fff; }

    /* ── CHART ── */
    .chart-section {
      display: none;
      margin-top: 28px;
      border: 2px solid #1a3a8f;
      padding: 20px;
      background: #fff;
    }
    .chart-section.visible { display: block; }

    .chart-title { font-size: 15px; font-weight: 600; color: #1a3a8f; margin-bottom: 16px; }

    .chart-legend {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #4a5e9e;
      margin-bottom: 12px;
    }
    .chart-legend span { display: inline-block; width: 24px; height: 3px; background: #1a3a8f; }

    .chart-canvas-wrap { position: relative; width: 100%; height: 280px; }

    /* ── FOOTER ── */
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: 12px;
      color: #6b80b8;
      font-family: 'Inter', sans-serif;
      letter-spacing: 2px;
      text-transform: lowercase;
    }
    .footer a { color: #1a3a8f; font-weight: 600; text-decoration: none; letter-spacing: 2px; }
    .footer a:hover { text-decoration: underline; }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      body { padding: 20px 8px 50px; }
      h1 { font-size: 16px; letter-spacing: 3px; }
      .subtitle { font-size: 9px; letter-spacing: 2px; }

      .tbl-wrap { display: block; }
      .card-list { display: none; }

      table { font-size: 11px; }

      colgroup col.c-waktu   { width: 52px; }
      colgroup col.c-suhu    { width: 56px; }
      colgroup col.c-gas     { width: 64px; }
      colgroup col.c-catatan { width: auto; }
      colgroup col.c-act     { width: 30px; }

      thead th {
        font-size: 9px;
        padding: 8px 5px;
        letter-spacing: 1px;
      }

      tbody td { padding: 5px 5px; }

      tbody td input[type="text"],
      tbody td input[type="number"],
      tbody td input[type="time"] {
        font-size: 11px;
        padding: 4px 5px;
      }

      .time-text { font-size: 11px; }
      .icon-btn { font-size: 13px; padding: 2px 3px; }

      .actions { flex-direction: column; }
      .add-btn, .chart-btn, .clear-btn { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>TUNGKU AKU SUKSES NANTI</h1>
    <p class="subtitle">sebuah jurnal damkar (dalam membakar keramik)</p>
    <p class="save-indicator" id="saveIndicator">—</p>

    <!-- DESKTOP TABLE -->
    <div class="tbl-wrap">
      <table id="tbl">
        <colgroup>
          <col class="c-waktu" />
          <col class="c-suhu" />
          <col class="c-gas" />
          <col class="c-catatan" />
          <col class="c-act" />
        </colgroup>
        <thead>
          <tr>
            <th>WAKTU</th>
            <th>SUHU (°C)</th>
            <th>ISI GAS</th>
            <th>CATATAN</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- MOBILE CARDS -->
    <div class="card-list" id="cardList"></div>

    <div class="actions">
      <button class="add-btn" onclick="addRow()">
        <i class="ti ti-plus" aria-hidden="true"></i> Tambah Baris
      </button>
      <button class="chart-btn" onclick="toggleChart()">Buat Grafik</button>
      <button class="clear-btn" onclick="clearAll()" title="Hapus semua data">
        <i class="ti ti-trash" aria-hidden="true"></i> Reset
      </button>
    </div>

    <div class="chart-section" id="chartSection">
      <div class="chart-title" id="chartTitle">Grafik Kenaikan Suhu</div>
      <div class="chart-legend"><span></span> Suhu (°C)</div>
      <div class="chart-canvas-wrap">
        <canvas id="tempChart" role="img" aria-label="Line chart kenaikan suhu tungku berdasarkan waktu pencatatan.">
          Grafik menampilkan data suhu tungku dari tabel di atas.
        </canvas>
      </div>
    </div>

    <div class="footer">
      dibuat oleh <a href="https://instagram.com/dhyaksargya" target="_blank" rel="noopener noreferrer">@dhyaksargya</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
  <script>
    const STORAGE_KEY = 'tungku-jurnal-v1';
    let rowCount = 0;
    let chartInstance = null;
    let saveTimer = null;

    /* ── TIME ── */
    function nowTimeStr() {
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      return pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    /* ── SAVE / LOAD ── */
    function collectRows() {
      const rows = [];
      document.querySelectorAll('#tbody tr').forEach(tr => {
        const id = tr.dataset.id;
        rows.push({
          id,
          time:    document.getElementById('time-text-' + id)?.textContent.trim() || '',
          suhu:    document.getElementById('suhu-' + id)?.value || '',
          gas:     document.getElementById('gas-' + id)?.value || '',
          catatan: document.getElementById('catatan-' + id)?.value || ''
        });
      });
      return rows;
    }

    function saveData() {
      const rows = collectRows();
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ rowCount, rows }));
      const ind = document.getElementById('saveIndicator');
      ind.textContent = 'tersimpan otomatis';
      ind.classList.add('saved');
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        ind.textContent = '—';
        ind.classList.remove('saved');
      }, 2000);
    }

    function loadData() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) { addRow(); return; }
      try {
        const { rowCount: savedCount, rows } = JSON.parse(raw);
        rowCount = savedCount || 0;
        if (!rows || rows.length === 0) { addRow(); return; }
        rows.forEach(r => renderRow(r.id, r.time, r.suhu, r.gas, r.catatan));
        // make sure future addRow increments past saved ids
        rowCount = Math.max(...rows.map(r => parseInt(r.id)), 0);
      } catch(e) {
        addRow();
      }
    }

    function clearAll() {
      if (!confirm('Hapus semua data jurnal di perangkat ini?')) return;
      localStorage.removeItem(STORAGE_KEY);
      document.getElementById('tbody').innerHTML = '';
      document.getElementById('cardList').innerHTML = '';
      rowCount = 0;
      addRow();
    }

    /* ── RENDER ROW (used by both addRow and loadData) ── */
    function renderRow(id, time, suhu, gas, catatan) {
      id = String(id);

      // Desktop
      const tbody = document.getElementById('tbody');
      const tr = document.createElement('tr');
      tr.dataset.id = id;
      tr.innerHTML = `
        <td class="time-cell">
          <div class="time-display" id="time-display-${id}">
            <span class="time-text" id="time-text-${id}">${time}</span>
            <button class="icon-btn" onclick="editTime('${id}')" aria-label="edit waktu" title="Edit waktu">
              <i class="ti ti-pencil" aria-hidden="true"></i>
            </button>
          </div>
          <input type="time" id="time-input-${id}" value="${time}" style="display:none;"
            onblur="saveTime('${id}')" onkeydown="if(event.key==='Enter')saveTime('${id}')" />
        </td>
        <td class="suhu-cell">
          <input type="number" id="suhu-${id}" value="${suhu}" placeholder="cth. 1100" min="0" max="9999" step="0.1" oninput="saveData()" />
        </td>
        <td>
          <input type="text" id="gas-${id}" value="${gas}" placeholder="cth. 1/4 tabung" oninput="saveData()" />
        </td>
        <td>
          <input type="text" id="catatan-${id}" value="${catatan}" placeholder="catatan opsional..." oninput="saveData()" />
        </td>
        <td>
          <div class="act-cell">
            <button class="icon-btn del" onclick="delRow('${id}')" aria-label="hapus baris" title="Hapus baris">
              <i class="ti ti-trash" aria-hidden="true"></i>
            </button>
          </div>
        </td>
      `;
      tbody.appendChild(tr);

      // Mobile
      const cardList = document.getElementById('cardList');
      const card = document.createElement('div');
      card.className = 'entry-card';
      card.dataset.id = id;
      card.innerHTML = `
        <div class="card-header">
          <span class="card-num">ENTRI #${id}</span>
          <button class="icon-btn del" onclick="delRow('${id}')" aria-label="hapus entri">
            <i class="ti ti-trash" aria-hidden="true"></i>
          </button>
        </div>
        <div class="card-body">
          <div class="card-field">
            <div class="card-label">WAKTU</div>
            <div class="card-time-display" id="card-time-display-${id}">
              <span class="card-time-text" id="card-time-text-${id}">${time}</span>
              <button class="icon-btn" onclick="editTime('${id}')" aria-label="edit waktu">
                <i class="ti ti-pencil" aria-hidden="true"></i>
              </button>
            </div>
            <input type="time" id="card-time-input-${id}" value="${time}" style="display:none;"
              onblur="saveTime('${id}')" onkeydown="if(event.key==='Enter')saveTime('${id}')" />
          </div>
          <div class="card-field">
            <div class="card-label">SUHU (°C)</div>
            <input type="number" id="card-suhu-${id}" value="${suhu}" placeholder="cth. 1100" min="0" max="9999" step="0.1"
              oninput="syncFromCard('${id}','suhu',this.value)" />
          </div>
          <div class="card-field">
            <div class="card-label">ISI GAS</div>
            <input type="text" id="card-gas-${id}" value="${gas}" placeholder="cth. 1/4 tabung"
              oninput="syncFromCard('${id}','gas',this.value)" />
          </div>
          <div class="card-field">
            <div class="card-label">CATATAN</div>
            <input type="text" id="card-catatan-${id}" value="${catatan}" placeholder="catatan opsional..."
              oninput="syncFromCard('${id}','catatan',this.value)" />
          </div>
        </div>
      `;
      cardList.appendChild(card);
    }

    /* mobile → desktop sync so collectRows() always reads desktop fields */
    function syncFromCard(id, field, val) {
      const el = document.getElementById(field + '-' + id);
      if (el) el.value = val;
      saveData();
    }

    /* ── ADD ROW ── */
    function addRow() {
      rowCount++;
      renderRow(rowCount, nowTimeStr(), '', '', '');
      saveData();
    }

    /* ── TIME EDIT ── */
    function editTime(id) {
      const disp = document.getElementById('time-display-' + id);
      const inp  = document.getElementById('time-input-' + id);
      if (disp && inp) { disp.style.display = 'none'; inp.style.display = 'block'; inp.focus(); }
      const cDisp = document.getElementById('card-time-display-' + id);
      const cInp  = document.getElementById('card-time-input-' + id);
      if (cDisp && cInp) { cDisp.style.display = 'none'; cInp.style.display = 'block'; cInp.focus(); }
    }

    function saveTime(id) {
      const inp  = document.getElementById('time-input-' + id);
      const cInp = document.getElementById('card-time-input-' + id);
      const val  = (inp?.value) || (cInp?.value) || '';

      const textEl  = document.getElementById('time-text-' + id);
      const disp    = document.getElementById('time-display-' + id);
      if (textEl && val) textEl.textContent = val;
      if (inp)  inp.style.display  = 'none';
      if (disp) disp.style.display = 'flex';

      const cTextEl = document.getElementById('card-time-text-' + id);
      const cDisp   = document.getElementById('card-time-display-' + id);
      if (cTextEl && val) cTextEl.textContent = val;
      if (cInp)  cInp.style.display  = 'none';
      if (cDisp) cDisp.style.display = 'flex';

      saveData();
    }

    /* ── DELETE ── */
    function delRow(id) {
      const tr = document.querySelector('#tbody tr[data-id="' + id + '"]');
      if (tr) tr.remove();
      const card = document.querySelector('.entry-card[data-id="' + id + '"]');
      if (card) card.remove();
      saveData();
    }

    /* ── CHART ── */
    function getChartData() {
      const labels = [], values = [];
      document.querySelectorAll('#tbody tr').forEach(tr => {
        const id = tr.dataset.id;
        const suhu = parseFloat(document.getElementById('suhu-' + id)?.value);
        if (!isNaN(suhu)) {
          labels.push(document.getElementById('time-text-' + id)?.textContent.trim() || '');
          values.push(suhu);
        }
      });
      return { labels, values };
    }

    function toggleChart() {
      const sec     = document.getElementById('chartSection');
      const titleEl = document.getElementById('chartTitle');
      const { labels, values } = getChartData();

      sec.classList.add('visible');

      if (values.length === 0) {
        titleEl.textContent = 'Grafik Kenaikan Suhu — belum ada data suhu yang diisi.';
        if (chartInstance) { chartInstance.destroy(); chartInstance = null; }
        return;
      }

      titleEl.textContent = 'Grafik Kenaikan Suhu';
      const ctx = document.getElementById('tempChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels,
          datasets: [{
            label: 'Suhu (°C)',
            data: values,
            borderColor: '#1a3a8f',
            backgroundColor: 'rgba(26,58,143,0.10)',
            pointBackgroundColor: '#1a3a8f',
            pointBorderColor: '#fff',
            pointBorderWidth: 2,
            pointRadius: 6,
            pointHoverRadius: 8,
            fill: true,
            tension: 0.35,
            borderWidth: 2.5
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { callbacks: { label: c => ' ' + c.parsed.y.toFixed(1) + ' °C' } }
          },
          scales: {
            x: {
              ticks: { font: { family: 'Inter', size: 11 }, color: '#4a5e9e', maxRotation: 30, autoSkip: true, maxTicksLimit: 10 },
              grid: { color: 'rgba(26,58,143,0.07)' }
            },
            y: {
              ticks: { font: { family: 'Inter', size: 11 }, color: '#4a5e9e', callback: v => v + ' °C' },
              grid: { color: 'rgba(26,58,143,0.07)' }
            }
          }
        }
      });
    }

    /* ── INIT ── */
    loadData();
  </script>
</body>
</html>
